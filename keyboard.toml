# TOTEM — RMK

[keyboard]
name = "Keyboard"
product_name = "TOTEM"
manufacturer = "Y"
serial_number = "vial:7a3c0002:000001"
vendor_id = 0x3A3C
product_id = 0x0002
chip = "nrf52840"
usb_enable = true

[layout]
rows = 8
cols = 5
map = """
(4,0,L) (4,1,L) (4,2,L) (4,3,L) (4,4,L)    (0,4,R) (0,3,R) (0,2,R) (0,1,R) (0,0,R)
(5,0,L) (5,1,L) (5,2,L) (5,3,L) (5,4,L)    (1,4,R) (1,3,R) (1,2,R) (1,1,R) (1,0,R)
(6,0,L) (6,1,L) (6,2,L) (6,3,L) (6,4,L)    (2,4,R) (2,3,R) (2,2,R) (2,1,R) (2,0,R)
(7,0,L)         (7,2,L) (7,3,L) (7,4,L)    (3,4,R) (3,3,R) (3,2,R)         (3,0,R)
"""

[keymap]
layers = 12

[split]
connection = "ble"

[split.central]
rows = 4
cols = 5
row_offset = 4
col_offset = 0
battery_adc_pin = "P0_31"
adc_divider_measured = 510
adc_divider_total = 1510
battery_user_description = "Left"

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"]
row2col = false

[[split.central.output]]
pin = "P0_14"
initial_state_active = true
low_active = true

[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
battery_adc_pin = "P0_31"
adc_divider_measured = 510
adc_divider_total = 1510
battery_user_description = "Right"

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"]
row2col = false

[[split.peripheral.output]]
pin = "P0_14"
initial_state_active = true
low_active = true

[ble]
enabled = true
use_2m_phy = true
default_tx_power = 0
passkey_entry = false

[storage]
enabled = true
clear_storage = true
clear_layout = false

[host]
vial_enabled = true
rynk_enabled = false
insecure = true

[rmk]
morse_max_num = 48
max_patterns_per_key = 4
combo_max_num = 16
combo_max_length = 4
fork_max_num = 16
macro_space_size = 1024
ble_profiles_num = 1
mouse_key_interval = 10
mouse_wheel_interval = 80
split_central_sleep_timeout_seconds = 600

[chip.nrf52840]
dcdc_reg0 = false
dcdc_reg1 = true
