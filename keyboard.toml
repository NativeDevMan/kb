# TOTEM — RMK
# Левая половина: central
# Правая половина: peripheral
# Настройка раскладки: через Vial

[keyboard]
name = "TOTEM"
product_name = "TOTEM RMK"
manufacturer = "TOTEM"

# Совпадают с vial.json.
vendor_id = 0x3A3C
product_id = 0x0002

# Встроенное описание платы RMK.
chip = "nrf52840"

# Подключение central к компьютеру по USB.
usb_enable = true


[layout]
# Общая матрица из vial.json.
rows = 8
cols = 5

# Физические позиции, а не назначения клавиш.
# L/R обозначают левую и правую руку.
map = """
(4,0,L) (4,1,L) (4,2,L) (4,3,L) (4,4,L)    (0,4,R) (0,3,R) (0,2,R) (0,1,R) (0,0,R)
(5,0,L) (5,1,L) (5,2,L) (5,3,L) (5,4,L)    (1,4,R) (1,3,R) (1,2,R) (1,1,R) (1,0,R)
(6,0,L) (6,1,L) (6,2,L) (6,3,L) (6,4,L)    (2,4,R) (2,3,R) (2,2,R) (2,1,R) (2,0,R)
(7,0,L)         (7,2,L) (7,3,L) (7,4,L)    (3,4,R) (3,3,R) (3,2,R)         (3,0,R)
"""


[keymap]
# Слои 0–15. Изначально без пользовательских назначений.
layers = 16


[split]
# Соединение между половинами.
connection = "ble"


# Левая половина — central.
[split.central]
rows = 4
cols = 5
row_offset = 4
col_offset = 0

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"]
row2col = false


# Правая половина — peripheral.
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"]
row2col = false


[ble]
enabled = true


[storage]
enabled = true
clear_storage = false
clear_layout = false


[host]
vial_enabled = true
rynk_enabled = false

# Защищённые функции Vial доступны сразу.
insecure = true

# Комбинация остаётся на случай, если сессия будет заблокирована.
unlock_keys = [[4, 0], [4, 1]]


[rmk]
# Запас для настройки функций через Vial.
combo_max_num = 16
combo_max_length = 4
morse_max_num = 16

# Общий объём данных макросов в байтах.
macro_space_size = 1024

# Профили подключения к компьютерам и другим хостам.
ble_profiles_num = 3


[chip.nrf52840]
# Не включаем DC/DC без проверки аппаратной схемы.
dcdc_reg0 = false
dcdc_reg1 = false
