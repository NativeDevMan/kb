name: Build TOTEM RMK firmware

on:
  workflow_dispatch:
  push:

env:
  RUST_MIN_STACK: "67108864"
  RUST_TOOLCHAIN: "1.96.0"

  # Обходной параметр для генерации nRF Bluetooth bindings.
  BINDGEN_EXTRA_CLANG_ARGS: "-ffreestanding -include stdint.h"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Set up cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install build tools
        run: cargo binstall rmkit flip-link cargo-make -y

      - name: Install ARM GCC and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi clang libclang-dev libnewlib-dev

      - name: Print tool versions
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS=$BINDGEN_EXTRA_CLANG_ARGS"
          rustc --version
          cargo --version
          rmkit --version
          clang --version
          arm-none-eabi-gcc --version

      - name: Create firmware project
        run: |
          rmkit create \
            --keyboard-toml-path keyboard.toml \
            --vial-json-path vial.json \
            --version 0.9 \
            --target-dir rmk

      - name: Pin generated Rust toolchain
        working-directory: ./rmk
        run: |
          if [ -f rust-toolchain.toml ]; then
            sed -i "s/^channel = .*/channel = \"$RUST_TOOLCHAIN\"/" rust-toolchain.toml
          fi
          rustup toolchain install "$RUST_TOOLCHAIN"

      - name: Improve XIAO battery ADC sampling
        run: |
          git clone --depth 1 --branch rmk-v0.9.0 \
            https://github.com/rmk-rs/rmk.git rmk-battery-source

          python3 - <<'PY'
          from pathlib import Path

          path = Path("rmk-battery-source/rmk-macro/src/codegen/input_device/adc.rs")
          text = path.read_text()

          old_channel = "saadc::ChannelConfig::single_ended(p.#adc_pin_def.degrade_saadc())"
          new_channel = """{
              let mut channel = saadc::ChannelConfig::single_ended(
                  p.#adc_pin_def.degrade_saadc()
              );
              channel.time = saadc::Time::_40US;
              channel
          }"""

          old_config = "let saadc_config = saadc::Config::default();"
          new_config = """let mut saadc_config = saadc::Config::default();
                        saadc_config.oversample = saadc::Oversample::Over8x;"""

          if text.count(old_channel) != 2:
              raise SystemExit("Unexpected number of ADC channel definitions")
          text = text.replace(old_channel, new_channel, 1)

          if text.count(old_config) != 1:
              raise SystemExit("Expected exactly one ADC configuration")
          text = text.replace(old_config, new_config, 1)

          path.write_text(text)

          manifest = Path("rmk/Cargo.toml")
          content = manifest.read_text()
          if "[patch.crates-io]" in content:
              raise SystemExit("Cargo.toml already has [patch.crates-io]")

          with manifest.open("a") as f:
              f.write(
                  '\n[patch.crates-io]\n'
                  'rmk-macro = { path = "../rmk-battery-source/rmk-macro" }\n'
              )
          PY

          cd rmk
          cargo tree -i rmk-macro | tee /tmp/rmk-macro-tree.txt
          grep -F "rmk-battery-source/rmk-macro" /tmp/rmk-macro-tree.txt

      - name: Enable split BLE connection subrating
        working-directory: ./rmk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          manifest = Path("Cargo.toml")
          text = manifest.read_text()

          # The RMK 0.9 nRF split template already enables async_matrix.
          # Insert subrating into the same RMK dependency feature list.
          old = '    "async_matrix",'
          new = '    "async_matrix",\n    "subrating",'

          if text.count(old) != 1:
              raise SystemExit(
                  "Unexpected Cargo.toml: expected exactly one async_matrix entry"
              )

          text = text.replace(old, new, 1)

          # Fail the build if the resulting manifest is invalid or if either
          # feature is not attached to the actual RMK dependency.
          data = tomllib.loads(text)
          features = data["dependencies"]["rmk"]["features"]

          for feature in ("async_matrix", "subrating"):
              if feature not in features:
                  raise SystemExit(f"Missing RMK feature: {feature}")

          manifest.write_text(text)
          print("Enabled RMK features:", features)
          PY

          # Confirm Cargo actually resolves the feature, not just the text edit.
          cargo tree -e features -i rmk | tee /tmp/rmk-features.txt
          grep -F 'rmk feature "subrating"' /tmp/rmk-features.txt

      - name: Build firmware
        working-directory: ./rmk
        run: |
          cargo build --release
          cargo make uf2 --release

      - name: Upload UF2 files
        uses: actions/upload-artifact@v7
        with:
          name: totem-uf2
          path: rmk/*.uf2
          if-no-files-found: error

      - name: Upload dependency lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: rmk/Cargo.lock
          if-no-files-found: warn
